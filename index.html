<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronCore Fitness</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
    body{background:#0d0d0d;color:#f2f2f2;}
    a{text-decoration:none;color:inherit;}
    header{background:#1a1a1a;color:#f2f2f2;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #c9a227;}
    header h1{color:#ffd700;font-size:1.5rem;letter-spacing:2px;}
    nav ul{display:flex;list-style:none;gap:1.5rem;}
    nav ul li a:hover{color:#c0c0c0;transition:0.3s;}
    .hero{background:url('https://images.unsplash.com/photo-1593079831268-3381b0db4a77?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80') no-repeat center center/cover;height:80vh;display:flex;justify-content:center;align-items:center;text-align:center;position:relative;}
    .hero::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);}
    .hero-content{position:relative;z-index:1;color:#fff;}
    .hero h2{font-size:3rem;margin-bottom:1rem;color:#ffd700;}
    .hero p{font-size:1.2rem;margin-bottom:2rem;}
    .btn{background:#ffd700;color:#000;padding:.8rem 1.5rem;border-radius:5px;font-weight:bold;transition:.3s;display:inline-block;}
    .btn:hover{background:#c9a227;}
    footer{background:#1a1a1a;color:#ccc;text-align:center;padding:1rem;border-top:2px solid #c9a227;margin-top:3rem;}
  </style>
</head>
<body>

<header>
  <h1>IRONCORE FITNESS</h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h2>Strength Starts Here</h2>
    <p>Elite gear for Powerlifting, Strongman, and Bodybuilding</p>
    <a href="shop.html" class="btn">Shop Now</a>
  </div>
</section>

<footer>
  <p>&copy; 2025 IronCore Fitness | All Rights Reserved</p>
</footer>

<script>
  const btns = document.querySelectorAll('.btn');
  btns.forEach(btn=>btn.addEventListener('click',()=>{console.log('Clicked');}));
</script>
</body>
</html>
