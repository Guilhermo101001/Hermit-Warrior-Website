<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact IronCore Fitness</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
    body{background:#0d0d0d;color:#f2f2f2;}
    a{text-decoration:none;color:inherit;}
    header{background:#1a1a1a;color:#f2f2f2;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #c9a227;}
    header h1{color:#ffd700;font-size:1.5rem;letter-spacing:2px;}
    nav ul{display:flex;list-style:none;gap:1.5rem;}
    nav ul li a:hover{color:#c0c0c0;transition:0.3s;}
    .contact-form{max-width:600px;margin:2rem auto;padding:2rem;background:#1a1a1a;border-radius:10px;border:1px solid #333;}
    .contact-form h2{text-align:center;margin-bottom:1rem;color:#ffd700;}
    .contact-form label{display:block;margin-top:1rem;margin-bottom:.3rem;}
    .contact-form input,.contact-form textarea{width:100%;padding:.7rem;border-radius:5px;border:1px solid #555;background:#0d0d0d;color:#fff;}
    .contact-form button{margin-top:1rem;background:#ffd700;color:#000;padding:.8rem 1.5rem;border:none;border-radius:5px;font-weight:bold;cursor:pointer;transition:.3s;}
    .contact-form button:hover{background:#c9a227;}
    footer{background:#1a1a1a;color:#ccc;text-align:center;padding:1rem;border-top:2px solid #c9a227;margin-top:3rem;}
  </style>
</head>
<body>

<header>
  <h1>IRONCORE FITNESS</h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<div class="contact-form">
  <h2>Contact Us</h2>
  <form onsubmit="submitForm(event)">
    <label for="name">Name</label>
    <input type="text" id="name" required>
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <label for="message">Message</label>
    <textarea id="message" rows="5" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</div>

<footer>
  <p>&copy; 2025 IronCore Fitness | All Rights Reserved</p>
</footer>

<script>
  function submitForm(e){
    e.preventDefault();
    alert('Thank you! Your message has been sent (demo).');
  }
</script>

</body>
</html>
